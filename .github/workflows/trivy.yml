name: "Trivy Security Scanner"

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:  # Enable manual triggering

jobs:
  trivy:
    name: Trivy Scan
    runs-on: ubuntu-24.04
    permissions:
      security-events: write
      contents: read

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Install Trivy
      run: |
        sudo apt-get update && sudo apt-get install -y wget gnupg apt-transport-https
        wget -qO - https://aquasecurity.github.io/trivy-repo/deb/public.key | gpg --dearmor | sudo tee /usr/share/keyrings/trivy.gpg > /dev/null || exit 1
        echo "deb [signed-by=/usr/share/keyrings/trivy.gpg] https://aquasecurity.github.io/trivy-repo/deb generic main" | sudo tee /etc/apt/sources.list.d/trivy.list
        sudo apt-get update && sudo apt-get install -y trivy

    - name: Run Trivy – filesystem scan (secrets & misconfigurations)
      run: trivy fs --scanners secret,misconfig --format sarif --output trivy-results.sarif --severity CRITICAL,HIGH,MEDIUM .

    - name: Upload Trivy SARIF results to GitHub Security tab
      uses: github/codeql-action/upload-sarif@v4
      if: always()
      with:
        sarif_file: 'trivy-results.sarif'
        category: 'trivy'
