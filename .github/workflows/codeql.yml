name: "CodeQL Advanced"

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:  # Enable manual triggering

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-24.04
    permissions:
      # required for all workflows
      security-events: write
      # required to fetch internal or private CodeQL packs
      packages: read
      # only required for workflows in private repositories
      actions: read
      contents: read

    strategy:
      fail-fast: true
      matrix:
        include:
        - language: c-cpp
          build-mode: manual
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        submodules: recursive  # Initialize git submodules required for build

    # Install system dependencies required for building this C++ project
    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          cmake \
          ninja-build \
          libgl1-mesa-dev \
          libglu1-mesa-dev \
          libx11-dev \
          libxrandr-dev \
          libxinerama-dev \
          libxcursor-dev \
          libxi-dev \
          libopenal-dev \
          libfreetype6-dev \
          libvulkan-dev \
          libwayland-dev \
          libwayland-bin \
          libxkbcommon-dev \
          glslc

    # Initializes the CodeQL tools for scanning.
    - name: Initialize CodeQL
      uses: github/codeql-action/init@v4
      with:
        languages: ${{ matrix.language }}
        build-mode: ${{ matrix.build-mode }}
        config-file: .github/codeql-config.yml

    # Build the project using CMake
    - name: Run manual build steps
      if: matrix.build-mode == 'manual'
      shell: bash
      run: |
        mkdir -p build
        cd build
        cmake -G Ninja -DCMAKE_BUILD_TYPE=Release ..
        cmake --build .

    - name: Perform CodeQL Analysis
      uses: github/codeql-action/analyze@v4
      with:
        category: "/language:${{matrix.language}}"

  # Create GitHub issues for any open security alerts
  create-issues:
    name: Create Issues from Alerts
    needs: analyze
    # Only run on pushes to main, not on pull requests
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      # Required to read code scanning alerts
      security-events: read
      # Required to create issues
      issues: write
      # Required to read repository content
      contents: read

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Create issues from CodeQL alerts
      env:
        GH_TOKEN: ${{ github.token }}
        GITHUB_REPOSITORY: ${{ github.repository }}
      run: |
        chmod +x .github/scripts/create-issues-from-alerts.sh
        .github/scripts/create-issues-from-alerts.sh
